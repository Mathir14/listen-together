services:
  - type: web
    name: listen-together
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: APP_ENV
        value: production
      - key: RECONNECT_GRACE_MS
        value: 60000
